<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="UZBalance — O'zbekiston korxonalari uchun onlayn buxgalteriya platformasi"
    />
    <title>UZBalance — Onlayn buxgalteriya</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem('uzb.theme') || 'light'
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
